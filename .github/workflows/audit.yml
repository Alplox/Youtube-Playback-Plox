name: Audit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      # pnpm 11 requires Node >= 22.13 (it loads the built-in `node:sqlite`),
      # so the runner must use Node 22+ for `pnpm store path` in setup-node's cache step.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install (pnpm)
        run: pnpm install --frozen-lockfile

      - name: Syntax check (userscript)
        run: node --check youtube-playback-plox.user.js

      - name: AGENTS.md rule lint + release consistency
        run: node scripts/audit-lint.mjs

      - name: Scope check (no unresolved references)
        run: node scripts/scope-check.mjs

      - name: Validate translations
        run: node scripts/validate-translations.mjs

      # Self-healing: the generated doc only depends on the source, so CI can
      # rebuild it. On `main` the result is committed back; on pull requests
      # (including forks) there is nothing to push to, so the check fails.
      - name: Regenerate structure doc
        run: node scripts/generate-structure.mjs

      - name: Commit regenerated structure doc
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git add docs/userscript-structure.md
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: regenerate userscript-structure.md'
          git pull --rebase --autostash
          git push

      - name: Structure doc is up to date
        run: |
          git diff --quiet -- docs/userscript-structure.md || (
            echo "::error::docs/userscript-structure.md was stale and could not be committed (PR or protected branch). Run: pnpm run structure"
            git diff --stat -- docs/userscript-structure.md
            exit 1
          )
